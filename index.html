<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEMOBANK</title>
<style>
:root {
  --bg:#eef1f8; --ink:#0d1224; --mut:#5b6580;
  --panel:#fff; --line:#d5dbea; --neon:#0a84ff;
  --glow:rgba(10,132,255,.25); --ok:#12a36b; --bad:#e5334b;
}
:root[data-theme="dark"] {
  --bg:#070a14; --ink:#e9eeff; --mut:#8a94b3;
  --panel:#0f1527; --line:#212b49;
}
:root[data-accent="purple"] {--neon:#a45bff;--glow:rgba(164,91,255,.3)}
:root[data-accent="red"] {--neon:#ff2a55;--glow:rgba(255,42,85,.3)}
* {box-sizing:border-box}
body {
  margin:0; min-height:100vh; color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,sans-serif;
  background:var(--bg);
}
main {max-width:480px;margin:auto;padding:20px 16px 100px}
.top {display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo {font-weight:900;font-size:23px;letter-spacing:3px;color:var(--neon)}
.mut {font-size:13px;color:var(--mut)}
.panel {background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card {
  border-radius:20px;padding:20px;height:190px;display:flex;
  flex-direction:column;justify-content:space-between;color:white;
  margin-bottom:20px;background:linear-gradient(135deg,#0a0f22,#182750,var(--neon));
  box-shadow:0 0 24px var(--glow);border:1px solid var(--neon);
}
.card.frozen {filter:grayscale(1)}
.cardtop,.cardbottom {display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip {width:40px;height:29px;border-radius:6px;background:linear-gradient(135deg,#d7dce4,#a8b6cb);border:1px solid #fff}
.cardnum {font-size:19px;letter-spacing:2px;overflow-wrap:anywhere}
.balance {font-size:35px;font-weight:850;margin:0 0 15px}
label {display:block;color:var(--mut);font-size:13px;margin:8px 0 5px}
input,select {
  width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font:inherit;margin-bottom:10px;
}
button {
  cursor:pointer;font:inherit;border-radius:11px;padding:11px 13px;
  border:1px solid var(--neon);color:var(--neon);background:transparent;
}
button:disabled {opacity:.5}
.btn {width:100%;font-weight:700}
.fill {background:var(--neon);color:white}
.row {display:flex;gap:8px}
.row>* {flex:1}
h2 {font-size:17px;margin:0 0 12px}
.bar {height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:10px 0}
.bar i {display:block;height:100%;background:var(--neon)}
.nav {
  position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;
  gap:4px;padding:8px 5px calc(8px + env(safe-area-inset-bottom));
  background:var(--panel);border-top:1px solid var(--line);
}
.nav button {flex:1;max-width:100px;padding:9px 2px;border:0;font-size:12px}
.nav button[aria-selected="true"] {background:var(--glow);color:var(--neon)}
.msg {font-size:13px;color:var(--mut);margin-top:10px;overflow-wrap:anywhere}
.item {display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child {border-bottom:0}
.item small {display:block;color:var(--mut)}
.plus {color:var(--ok)} .minus {color:var(--bad)}
.scr {background:#0b1020;color:#7dffc0;border-radius:10px;padding:14px;white-space:pre-line;margin-bottom:12px;min-height:70px}
.keys {display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button {font-size:18px;border-color:var(--line);color:var(--ink)}
[hidden] {display:none!important}
</style>
</head>
<body>
<main id="app">
  <div class="top"><div class="logo">DEMOBANK</div></div>
  <div class="panel">Загрузка DEMOBANK…</div>
</main>
<nav class="nav" id="nav" hidden></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";

const SUPABASE_URL="https://nfocubudqyedugnbzxmj.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mb2N1YnVkdXllZHVnbmJ6eG1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NzQzMTcsImV4cCI6MjEwODU1MDMxN30.rzpeqGS_0Txu8w53SomlHq6tOuodul22yfYrAQIoJz0";

const $=id=>document.getElementById(id);
const app=$("app"),nav=$("nav");
const money=n=>((Number(n)||0)/100).toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₽";
const cents=id=>Math.round((parseFloat($(id)?.value)||0)*100);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let db=null,profile=null,history=[],users=[];
let tab="home",mode="in",message="",pin="",purchase=0,terminalStage=1,terminalText="Введите сумму";
let theme=localStorage.getItem("demobank-theme")||"light";
let accent=localStorage.getItem("demobank-accent")||"blue";

function setTheme(){
  document.documentElement.dataset.theme=theme;
  document.documentElement.dataset.accent=accent;
}
setTheme();

function errorText(e){
  let m=e?.message||"Неизвестная ошибка";
  if(/invalid login|invalid credentials/i.test(m))return "Неверный email или пароль";
  if(/already registered/i.test(m))return "Этот email уже зарегистрирован";
  if(/rate limit/i.test(m))return "Слишком много попыток. Попробуйте позже";
  if(/fetch|network/i.test(m))return "Нет соединения с сервером";
  return m;
}

function authScreen(){
  nav.hidden=true;
  app.innerHTML=`
  <div class="top"><div class="logo">DEMOBANK</div></div>
  <section class="panel">
    <h2>${mode==="in"?"Вход в аккаунт":"Регистрация"}</h2>
    ${mode==="up"?'<label for="name">Имя</label><input id="name" autocomplete="name" maxlength="80">':""}
    <label for="email">Email</label><input id="email" type="email" autocomplete="email">
    <label for="password">Пароль</label><input id="password" type="password" autocomplete="${mode==="in"?"current-password":"new-password"}">
    <button class="btn fill" id="submit">${mode==="in"?"Войти":"Создать аккаунт"}</button>
    <div class="msg">${esc(message)}</div>
    <button class="btn" id="switch" style="margin-top:10px">${mode==="in"?"Создать аккаунт":"Уже есть аккаунт"}</button>
  </section>
  <p class="mut">DEMOBANK | 2026.</p>`;

  $("switch").onclick=()=>{mode=mode==="in"?"up":"in";message="";authScreen()};
  $("submit").onclick=async()=>{
 const email=$("email").value.trim();
 const password=$("password").value;
 const name=mode==="up"?$("name").value.trim():"";
if(!email||!password){
 message="Заполните email и пароль";
 authScreen();
 return;
 }
if(mode==="up"&&(!name||password.length<6)){
 message="Введите имя и пароль минимум из 6 символов";
 authScreen();
 return;
 }
const button=$("submit");
 button.disabled=true;
 button.textContent="Подключение к серверу…";
let timeoutId;
try{
 const request=mode==="in"
console.log("Supabase client:", !!db);
console.log("Supabase library:", typeof window.supabase);
console.log("Supabase URL:", SUPABASE_URL);
 ?db.auth.signInWithPassword({email,password})
 :db.auth.signUp({
 email,
 password,
 options:{data:{name}}
 });
const timeout=new Promise((_,reject)=>{
  timeoutId=setTimeout(
    ()=>reject(new Error("Тайм-аут: Supabase не ответил за 15 секунд. Проверь подключение и настройки проекта.")),
    15000
  );
});

const r=await Promise.race([request,timeout]);

if(r.error)throw r.error;

if(mode==="up"&&!r.data.session){
  mode="in";
  message="Аккаунт создан. Если подтверждение email включено, проверь почту.";
  authScreen();
  return;
}

await loadApp();
}catch(e){
 message=errorText(e);
 if(/тайм-аут/i.test(e?.message||"")){
 message=e.message;
 }
 authScreen();
 }finally{
 clearTimeout(timeoutId);
 const currentButton=$("submit");
 if(currentButton)currentButton.disabled=false;
 }
 };
}

async function loadApp(){
  try{
    const a=await db.from("profiles").select("id,email,name,balance,saved,goal,frozen,card,cvv,is_dev").single();
    if(a.error)throw a.error;
    profile=a.data;
    const h=await db.from("transactions").select("title,amount,ok,created_at").order("id",{ascending:false}).limit(60);
    history=h.error?[]:(h.data||[]);
    render();
  }catch(e){
    profile=null;message=errorText(e);authScreen();
  }
}

async function operation(fn,args,success){
  try{
    const r=await db.rpc(fn,args);
    if(r.error)throw r.error;
    if(r.data?.ok===false)message=r.data.reason||"Операция отклонена";
    else message=success||"Операция выполнена";
    await loadApp();
  }catch(e){message=errorText(e);render()}
}

function render(){
  if(!profile)return authScreen();
  const tabs=[["home","Главная"],["pos","Терминал"],["transfer","Перевод"],["history","История"],["settings","Профиль"]];
  if(profile.is_dev)tabs.push(["dev","Dev"]);
  nav.hidden=false;
  nav.innerHTML=tabs.map(([id,label])=>`<button data-tab="${id}" aria-selected="${tab===id}">${label}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
    tab=b.dataset.tab;message="";
    if(tab==="pos"){terminalStage=1;terminalText="Введите сумму"}
    if(tab==="dev"){
      try{const r=await db.rpc("dev_users");if(r.error)throw r.error;users=r.data||[]}
      catch(e){message=errorText(e)}
      render();return;
    }
    render();
  });
  const screens={home:homeScreen,pos:terminalScreen,transfer:transferScreen,history:historyScreen,settings:settingsScreen,dev:devScreen};
  app.innerHTML=`<div class="top"><div class="logo">DEMOBANK</div><small>${esc(profile.name)}</small></div>${(screens[tab]||homeScreen)()}`;
  bind();
}

function homeScreen(){
  const goal=Number(profile.goal)||0,saved=Number(profile.saved)||0;
  const percent=goal>0?Math.min(100,Math.max(0,Math.round(saved/goal*100))):0;
  return `
  <div class="card ${profile.frozen?"frozen":""}" id="bankcard" role="button" tabindex="0">
    <div class="cardtop"><div class="chip"></div><b>${profile.frozen?"ЗАМОРОЖЕНА":"MIR"}</b></div>
    <div class="cardnum">${esc(profile.card||"•••• •••• •••• ••••")}</div>
    <div class="cardbottom"><span>${esc(profile.name).toUpperCase()}</span><span id="cvv">12/30 · CVV ***</span></div>
  </div>
  <div class="mut">Баланс</div><div class="balance">${money(profile.balance)}</div>
  <p class="mut">Нажми на карту, чтобы показать CVV</p>
  <section class="panel">
    <h2>Копилка</h2><div class="mut">Цель: ${money(goal)}</div>
    <div class="bar"><i style="width:${percent}%"></i></div>
    <div class="mut">Накоплено ${money(saved)} (${percent}%)</div>
    <label for="saving">Сумма, ₽</label><input id="saving" type="number" min="1" value="1000">
    <div class="row"><button id="saveMoney">Отложить</button><button id="takeMoney">Вернуть</button></div>
    <div class="msg">${esc(message)}</div>
  </section>
  <section class="panel"><h2>Карта</h2>
    <button class="btn" id="freeze">${profile.frozen?"Разморозить карту":"Заморозить карту"}</button>
    <p class="mut">Кешбэк 1% с покупок через терминал, если он реализован в серверной функции.</p>
  </section>`;
}

function terminalScreen(){
  let controls="";
  if(terminalStage===1)controls='<label for="purchase">Сумма покупки, ₽</label><input id="purchase" type="number" min="1" value="1290"><button class="btn fill" id="startPay">Выставить счёт</button>';
  if(terminalStage===2)controls='<button class="btn fill" id="tapCard">Приложить карту</button>';
  if(terminalStage===3)controls='<div class="keys" id="pinKeys"></div>';
  return `<section class="panel"><h2>Эмулятор терминала</h2><div class="scr" id="screen">${esc(terminalText)}</div>${controls}<p class="mut">Демо-PIN: 1234</p><div class="msg">${esc(message)}</div></section>`;
}

function transferScreen(){
  return `<section class="panel"><h2>Перевод клиенту DEMOBANK</h2>
  <label for="recipient">Email получателя</label><input id="recipient" type="email">
  <label for="transferAmount">Сумма, ₽</label><input id="transferAmount" type="number" min="1" value="500">
  <button class="btn fill" id="sendTransfer">Перевести</button><div class="msg">${esc(message)}</div></section>`;
}

function historyScreen(){
  return `<section class="panel"><h2>История операций</h2>${history.length?history.map(h=>`
  <div class="item"><div>${esc(h.title)}<small>${h.created_at?new Date(h.created_at).toLocaleString("ru-RU"):""}${h.ok?"":" · отклонено"}</small></div>
  <div class="${h.ok?(h.amount<0?"minus":"plus"):""}">${h.amount>0?"+":""}${money(h.amount)}</div></div>`).join(""):'<p class="mut">Операций пока нет.</p>'}</section>`;
}

function settingsScreen(){
  return `<section class="panel"><h2>Оформление</h2>
  <label for="theme">Тема</label><select id="theme"><option value="light" ${theme==="light"?"selected":""}>Светлая</option><option value="dark" ${theme==="dark"?"selected":""}>Тёмная</option></select>
  <label for="accent">Цвет акцента</label><select id="accent"><option value="blue" ${accent==="blue"?"selected":""}>Синий</option><option value="purple" ${accent==="purple"?"selected":""}>Фиолетовый</option><option value="red" ${accent==="red"?"selected":""}>Красный</option></select>
  <p class="mut">${esc(profile.email)}</p><button class="btn" id="logout">Выйти</button></section>`;
}

function devScreen(){
  return `<section class="panel"><h2>Панель разработчика</h2>
  <label for="devAmount">Пополнить мой счёт, ₽</label><input id="devAmount" type="number" min="1" value="10000">
  <button class="btn fill" id="devTopup">Пополнить</button><div class="msg">${esc(message)}</div></section>
  <section class="panel"><h2>Аккаунты (${users.length})</h2>${users.map(u=>`<div class="item"><div>${esc(u.name)}<small>${esc(u.email)}</small></div><div>${money(u.balance)}</div></div>`).join("")}</section>`;
}

function bind(){
  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  on("bankcard",()=>{
    const cv=$("cvv");
    cv.textContent=cv.textContent.includes("***")?"12/30 · CVV "+(profile.cvv||"не задан"):"12/30 · CVV ***";
  });
  on("saveMoney",()=>{const a=cents("saving");if(a>0)operation("savings",{p_amount:a},"Средства отложены");else{message="Введите сумму больше нуля";render()}});
  on("takeMoney",()=>{const a=cents("saving");if(a>0)operation("savings",{p_amount:-a},"Средства возвращены");else{message="Введите сумму больше нуля";render()}});
  on("freeze",()=>operation("toggle_freeze",{},"Статус карты изменён"));
  on("startPay",()=>{
    const a=cents("purchase");
    if(a<=0){message="Введите сумму больше нуля";render();return}
    purchase=a;terminalStage=2;terminalText="К оплате: "+money(a)+"\n\nПриложите карту";render();
  });
  on("tapCard",()=>{pin="";terminalStage=3;terminalText="Карта прочитана\nВведите PIN-код:";render()});
  const keys=$("pinKeys");
  if(keys){
    ["1","2","3","4","5","6","7","8","9","Сброс","0","OK"].forEach(k=>{
      const b=document.createElement("button");b.textContent=k;keys.appendChild(b);
      b.onclick=async()=>{
        if(k==="Сброс")pin="";
        else if(k==="OK"){
          const r=await db.rpc("pay",{p_amount:purchase,p_pin:pin,p_merchant:"Магазин «Звезда»"});
          if(r.error){message=errorText(r.error);terminalText="ОШИБКА";render();return}
          const d=r.data||{};
          terminalText=d.ok?"ОДОБРЕНО\nСписано: "+money(purchase)+"\nКешбэк: "+money(d.cashback):"ОТКАЗ\n"+(d.reason||"Операция отклонена");
          terminalStage=1;await loadApp();tab="pos";render();return;
        }else if(pin.length<4)pin+=k;
        $("screen").textContent="Карта прочитана\nВведите PIN-код:\n"+"●".repeat(pin.length);
      };
    });
  }
  on("sendTransfer",()=>{
    const to=$("recipient").value.trim(),amount=cents("transferAmount");
    if(!to||amount<=0){message="Введите email и сумму больше нуля";render();return}
    operation("transfer",{p_to:to,p_amount:amount},"Перевод выполнен");
  });
  on("theme",e=>{});
  const th=$("theme");if(th)th.onchange=()=>{theme=th.value;localStorage.setItem("demobank-theme",theme);setTheme()};
  const ac=$("accent");if(ac)ac.onchange=()=>{accent=ac.value;localStorage.setItem("demobank-accent",accent);setTheme()};
  on("logout",async()=>{await db.auth.signOut();profile=null;mode="in";message="";authScreen()});
  on("devTopup",()=>{
    const amount=cents("devAmount");
    if(amount>0)operation("dev_topup",{p_amount:amount},"Счёт пополнен");
    else{message="Введите сумму больше нуля";render()}
  });
}


async function start(){
  app.innerHTML = '<section class="panel"><h2>Проверка подключения</h2><p id="check">Проверяем библиотеку Supabase...</p></section>';

  try {
    if (!window.supabase) {
      $("check").textContent = "ОШИБКА: библиотека Supabase не загрузилась.";
      return;
    }

    $("check").textContent = "Библиотека загружена. Создаём подключение...";

    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    $("check").textContent = "Подключение создано. Проверяем сессию...";

    const result = await Promise.race([
      db.auth.getSession(),
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error("Тайм-аут при проверке сессии")), 10000)
      )
    ]);

    if (result.error) throw result.error;

    if (result.data.session) {
      await loadApp();
    } else {
      authScreen();
    }
  } catch (e) {
    app.innerHTML = '<section class="panel"><h2>Ошибка запуска</h2><p id="error"></p></section>';
    $("error").textContent = e.message || String(e);
  }
}
start();
})();
</script>
</body>
</html>
